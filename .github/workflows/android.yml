# Compila los APK en cada push y PR. El de debug queda como artefacto del run para instalarlo en el telefono.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la libreria muve (checksum del release)
        run: (cd app/libs && sha256sum -c muve-android.aar.sha256)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de release (sin firmar; el workflow release lo firma)
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: muvi-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: muvi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
