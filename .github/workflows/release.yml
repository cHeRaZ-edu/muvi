# Al subir un tag vX.Y.Z: compila el APK de release, lo firma con tu llave (secretos del repo) y
# publica el release con el APK y su checksum.
#
# Secretos (Settings > Secrets and variables > Actions):
#   MUVI_KEYSTORE_B64       el .jks en base64 (base64 -w0 muvi-release.jks)
#   MUVI_KEYSTORE_PASSWORD  contrasena del almacen
#   MUVI_KEY_ALIAS          alias de la llave (muvi)
#   MUVI_KEY_PASSWORD       contrasena de la llave
# Sin ellos se compila igual, pero el APK queda SIN FIRMAR como artefacto del run y no se publica.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la libreria muve (checksum del release)
        run: (cd app/libs && sha256sum -c muve-android.aar.sha256)

      - name: Version del tag contra versionName
        id: ver
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::el tag ${GITHUB_REF_NAME} no coincide con versionName $V"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma
        id: key
        env:
          KS_B64: ${{ secrets.MUVI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/muvi.jks"
            echo "MUVI_KEYSTORE=$RUNNER_TEMP/muvi.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::faltan los secretos de firma: el APK queda sin firmar y no se publica"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de release y pruebas
        env:
          MUVI_KEYSTORE_PASSWORD: ${{ secrets.MUVI_KEYSTORE_PASSWORD }}
          MUVI_KEY_ALIAS: ${{ secrets.MUVI_KEY_ALIAS }}
          MUVI_KEY_PASSWORD: ${{ secrets.MUVI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace

      - name: Revisar firma y preparar archivos
        if: steps.key.outputs.signed == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/muvi-$V.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "out/muvi-$V.apk"
          (cd out && sha256sum "muvi-$V.apk" > checksums.txt)

      - name: Publicar release
        if: steps.key.outputs.signed == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
          else
            gh release create "v$V" out/* --title "muvi $V" --generate-notes
          fi

      - name: APK sin firmar (sin secretos)
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: muvi-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
